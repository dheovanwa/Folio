[package]
name = "folio"
version = "0.1.0"
edition = "2024"
description = "A lightweight, distraction-free URL article reader for Linux"
license = "MIT"
authors = ["Folio Contributors"]

[dependencies]
gtk = { package = "gtk4", version = "0.9", features = ["v4_14"] }
adw = { package = "libadwaita", version = "0.7", features = ["v1_5"] }
dom_smoothie = "0.19"
dom_query = "0.29"
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.42", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
async-channel = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
dirs = "6"
url = "2"
mimalloc = { version = "0.1", default-features = false }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
